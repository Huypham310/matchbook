name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format
          # fail if any tracked source would be rewritten
          find include src tests tools fuzz bench python \
            \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build
      - name: Configure + build
        run: |
          cmake --preset release -DMATCHBOOK_BUILD_BENCH=OFF
          cmake --build --preset release
      - name: Unit tests
        run: ctest --preset release --output-on-failure

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build
      - name: ASan + UBSan suite
        run: |
          cmake --preset asan -DMATCHBOOK_BUILD_BENCH=OFF
          cmake --build --preset asan
          ./build/asan/tests/matchbook_tests --gtest_brief=1

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain + bindings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build
          pip install -e ".[test]"
      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs unit tests during the build)
        run: docker build -t matchbook:ci .
      - name: Re-run the test binary from the image
        run: docker run --rm matchbook:ci
