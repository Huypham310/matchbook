<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>MatchBook pipeline: gateway, engine, publisher connected by SPSC rings</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="860" height="230" fill="#ffffff"/>

  <!-- stages -->
  <rect x="20" y="50" width="190" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="115" y="75" text-anchor="middle" font-weight="bold" fill="#0d47a1">gateway thread</text>
  <text x="115" y="97" text-anchor="middle" fill="#263238">proto::decode</text>
  <text x="115" y="115" text-anchor="middle" fill="#263238">rdtsc timestamp</text>
  <text x="115" y="133" text-anchor="middle" fill="#263238">optional open-loop pacing</text>

  <rect x="335" y="50" width="190" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="430" y="75" text-anchor="middle" font-weight="bold" fill="#1b5e20">engine thread</text>
  <text x="430" y="97" text-anchor="middle" fill="#263238">MatchingEngine</text>
  <text x="430" y="115" text-anchor="middle" fill="#263238">OrderBook (owned here only)</text>
  <text x="430" y="133" text-anchor="middle" fill="#263238">tags last event of a command</text>

  <rect x="650" y="50" width="190" height="90" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="745" y="75" text-anchor="middle" font-weight="bold" fill="#e65100">publisher thread</text>
  <text x="745" y="97" text-anchor="middle" fill="#263238">proto::encode_event</text>
  <text x="745" y="115" text-anchor="middle" fill="#263238">output buffer (owned here)</text>
  <text x="745" y="133" text-anchor="middle" fill="#263238">records latency</text>

  <!-- rings -->
  <rect x="235" y="78" width="75" height="34" rx="4" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
  <line x1="254" y1="78" x2="254" y2="112" stroke="#90a4ae"/>
  <line x1="273" y1="78" x2="273" y2="112" stroke="#90a4ae"/>
  <line x1="292" y1="78" x2="292" y2="112" stroke="#90a4ae"/>
  <text x="272" y="68" text-anchor="middle" fill="#37474f">SPSC ring</text>
  <text x="272" y="132" text-anchor="middle" fill="#546e7a">commands</text>

  <rect x="550" y="78" width="75" height="34" rx="4" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
  <line x1="569" y1="78" x2="569" y2="112" stroke="#90a4ae"/>
  <line x1="588" y1="78" x2="588" y2="112" stroke="#90a4ae"/>
  <line x1="607" y1="78" x2="607" y2="112" stroke="#90a4ae"/>
  <text x="587" y="68" text-anchor="middle" fill="#37474f">SPSC ring</text>
  <text x="587" y="132" text-anchor="middle" fill="#546e7a">events</text>

  <!-- arrows -->
  <line x1="210" y1="95" x2="233" y2="95" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="95" x2="333" y2="95" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="95" x2="548" y2="95" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="625" y1="95" x2="648" y2="95" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- latency bracket -->
  <path d="M115,150 L115,175 L745,175 L745,150" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="430" y="196" text-anchor="middle" fill="#b71c1c">latency = publisher sees last event (rdtsc) - gateway timestamp</text>
  <text x="430" y="216" text-anchor="middle" fill="#546e7a">~250-370 ns median for two thread hops (paced runs)</text>
</svg>
